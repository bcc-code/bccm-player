name: bccm_player
description: ExoPlayer/AVPlayer via platform views, with cast, PiP, background audio, audio selection, etc.
version: 2.2.1
documentation: https://bcc-code.github.io/bccm-player/
repository: https://github.com/bcc-code/bccm-player

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  collection: ^1.17.1
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3
  flutter_plugin_android_lifecycle: ^2.0.9
  flutter_state_notifier: ^1.0.0
  flutter_svg: ^2.0.2
  flutter_web_plugins:
    sdk: flutter
  freezed_annotation: ^3.1.0
  meta: ^1.9.1
  plugin_platform_interface: ^2.0.2
  riverpod: ^2.6.1
  state_notifier: ^1.0.0
  universal_io: ^2.0.4
  uuid: ^4.5.0
  wakelock_plus: ^1.1.1
  # Replaces dart:html in the web implementation; also what makes --wasm possible.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  pigeon: ^28.0.0
  build_runner: ^2.16.0
  freezed: ^4.0.1
  mockito: ^5.8.1
  # Explicit rather than transitive via flutter_test: the timer-based tests
  # (Debouncer, OneAsyncAtATime, the position ticker) depend on it directly.
  fake_async: ^1.3.3

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: media.bcc.bccm_player
        pluginClass: BccmPlayerPlugin
      ios:
        pluginClass: BccmPlayerPlugin
      web:
        pluginClass: BccmPlayerWeb
        fileName: bccm_player_web.dart
