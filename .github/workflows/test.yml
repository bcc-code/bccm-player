name: test

# Consuming apps run their own test suites, not this package's, so without this
# workflow nothing enforces them. bcc-media-app's Semaphore `Test` block does
# fire when `/submodules/` changes, but it only runs that app's own `test/` —
# a regression in here reaches every consuming app unchallenged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  bccm_player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Matches the `flutter: ">=3.44.0"` constraint in pubspec.yaml.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  # Nothing else compiles this plugin's Kotlin — `flutter analyze` and
  # `flutter test` are Dart-only. Same gap the `ios` job covers, but on the
  # cheap Linux runner.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          # Matches the `flutter: ">=3.44.0"` constraint in pubspec.yaml.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      - run: make android-test

  # Nothing else compiles this plugin's Swift. `flutter analyze` and
  # `flutter test` are Dart-only, so a codegen bump that breaks a hand-written
  # native implementation (as the Pigeon v22 -> v28 `@async` change did) reaches
  # consumers untested without this job. Building the test host also compiles
  # the whole plugin, so this covers "does iOS still build" as well as the
  # assertions in example/ios/RunnerTests.
  ios:
    # macos-26 rather than macos-15: the example app's `connectivity_plus`
    # needs the iOS 26 SDK (`NWPath.isUltraConstrained`), and macos-15 defaults
    # to Xcode 16.4 / iOS 18.5. This image is macOS 26.6.1 with Xcode 26.6
    # (17F113) — the same macOS and Xcode builds these tests were developed
    # against.
    runs-on: macos-26
    # Pinned explicitly rather than inherited: relying on the image's *default*
    # Xcode is what broke this job in the first place, and the default moves
    # without notice.
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Matches the `flutter: ">=3.44.0"` constraint in pubspec.yaml.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # Picks the newest iPhone simulator the runner image happens to ship.
      - run: make ios-test
