name: test

# Consuming apps run their own test suites, not this package's, so without this
# workflow nothing enforces them. bcc-media-app's Semaphore `Test` block does
# fire when `/submodules/` changes, but it only runs that app's own `test/` —
# a regression in here reaches every consuming app unchallenged.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  bccm_player:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Matches the `flutter: ">=3.44.0"` constraint in pubspec.yaml.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  # Nothing else compiles this plugin's Swift. `flutter analyze` and
  # `flutter test` are Dart-only, so a codegen bump that breaks a hand-written
  # native implementation (as the Pigeon v22 -> v28 `@async` change did) reaches
  # consumers untested without this job. Building the test host also compiles
  # the whole plugin, so this covers "does iOS still build" as well as the
  # assertions in example/ios/RunnerTests.
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Matches the `flutter: ">=3.44.0"` constraint in pubspec.yaml.
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - run: flutter pub get

      # Picks the newest iPhone simulator the runner image happens to ship.
      - run: make ios-test
